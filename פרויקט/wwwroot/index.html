<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>🍦 Ice Cream Shop</title>
    <link rel="stylesheet" href="css/site.css" />
</head>

<body>
    <!-- Header Navigation -->
    <header>
        <div id="greeting" class="greeting"></div>
        <nav class="nav-menu">
            <span id="adminLink" class="nav-link" onclick="location.href='user.html'">👥 Users</span>
            <span class="nav-link" onclick="toggleProfileForm()">✏️ Edit Profile</span>
            <button id="logoutBtn" onclick="handleLogout()" class="btn btn-danger">Logout</button>
        </nav>
    </header>

    <!-- Inline Login Form (shown when token expires) -->
    <div id="inlineLogin" class="login-card card hidden" dir="rtl">
        <form id="inlineLoginForm" action="javascript:void(0);" onsubmit="handleInlineLogin(event)">
            <h3>📥 התחברות מחדש</h3>
            <input id="inline-username" 
                   type="text" 
                   placeholder="שם משתמש" 
                   class="input-field"
                   required />
            <input id="inline-password" 
                   type="password" 
                   placeholder="סיסמה" 
                   class="input-field"
                   required />
            <input class="login-submit" type="submit" value="התחבר" />
            <p id="inline-error" class="error-message"></p>
        </form>
    </div>

    <!-- Protected Content (shown when authenticated) -->
    <div id="protectedContent" class="protected-content hidden">
        <h1>🍦 Ice Cream Shop</h1>

        <!-- Add New Item Form -->
        <section>
            <h3>➕ Add New Ice Cream</h3>
            <form id="addForm" action="javascript:void(0);" method="POST" onsubmit="addItem(); return false;" class="form-section">
                <input type="text" 
                       id="add-name" 
                       placeholder="Ice cream name (בעברית או אנגלית)"
                       class="input-field"
                       required>
                <input type="submit" value="Add" class="btn btn-primary">
            </form>
        </section>

        <!-- Edit Profile Form -->
        <section>
            <h3>👤 Edit Profile</h3>
            <form id="profileForm" 
                  action="javascript:void(0);" 
                  onsubmit="updateProfile(); return false;"
                  class="form-section hidden">
                <input type="text" 
                       id="profile-name" 
                       placeholder="Your name"
                       class="input-field"
                       required>
                <input type="password" 
                       id="profile-password" 
                       placeholder="New password (optional)"
                       class="input-field">
                <input type="submit" value="Save" class="btn btn-primary">
                <button type="button" 
                        onclick="toggleProfileForm()" 
                        class="btn btn-ghost">Cancel</button>
            </form>
        </section>

        <!-- Edit Item Form (hidden by default) -->
        <div id="editForm" class="form-section hidden">
            <h3>✏️ Edit Ice Cream</h3>
            <form action="javascript:void(0);" onsubmit="updateItem(); return false;">
                <input type="hidden" id="edit-id">
                <div style="margin-bottom: 1rem;">
                    <label style="display: flex; align-items: center;">
                        <input type="checkbox" id="edit-milki" style="margin-right: 0.5rem;">
                        <span>Is Milki (dairy)?</span>
                    </label>
                </div>
                <input type="text" 
                       id="edit-name" 
                       placeholder="Ice cream name"
                       class="input-field"
                       required>
                <div class="form-actions">
                    <input type="submit" value="Save" class="btn btn-primary">
                    <a onclick="closeInput()" 
                       class="btn btn-ghost" 
                       aria-label="Close Edit">Cancel</a>
                </div>
            </form>
        </div>

        <!-- Item Counter -->
        <div id="counterSection" class="info-box">
            <p id="counter"></p>
        </div>

        <!-- Activity Feed -->
        <section id="activityFeed" class="activity-section">
            <h3>🔔 Activity Feed</h3>
            <ul id="activityList" class="activity-list"></ul>
        </section>

        <!-- Items Table -->
        <section class="table-section">
            <h3>📋 Available Ice Creams</h3>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Is Milki?</th>
                            <th>Name</th>
                            <th>Actions</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="iceCreams"></tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer"></div>

    <!-- Load dependencies first -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script src="js/site.js" asp-append-version="true"></script>

    <!-- Page-specific functions and initialization -->
    <script>
        // Profile functions are defined in site.js - using centralized implementations

        function handleLogout() {
            removeToken();
            location.href = 'login.html';
        }

        // DOM-ready initialization: show inline login when not authenticated, show protected content when authenticated
        document.addEventListener('DOMContentLoaded', () => {
            const greetingEl = document.getElementById('greeting');
            const protectedEl = document.getElementById('protectedContent');
            const inlineLogin = document.getElementById('inlineLogin');
            const adminLink = document.getElementById('adminLink');

            function showProtected() {
                if (inlineLogin) inlineLogin.classList.add('hidden');
                if (protectedEl) protectedEl.classList.remove('hidden');
                const currentName = getUserName();
                const currentRole = getUserRole();
    
                if (greetingEl) {
                    greetingEl.innerText = `👋 Welcome, ${currentName}!`;
                }

                // Set profile form name and clear password for security
                const profileNameEl = document.getElementById('profile-name');
                const profilePasswordEl = document.getElementById('profile-password');
                if (profileNameEl) profileNameEl.value = currentName;
                if (profilePasswordEl) profilePasswordEl.value = ''; // Always empty for security

                // Show admin link only if user is admin
                if (adminLink) {
                    if (currentRole && (currentRole === 'Admin' || currentRole.toLowerCase() === 'admin')) {
                        adminLink.style.display = 'inline-block';
                    } else {
                        adminLink.style.display = 'none';
                    }
                }

                if (getToken()) {
                    getItems();
                    initSignalR();
                }
            }

            function showLogin() {
                // Redirect to the dedicated login page when not authenticated.
                location.href = 'login.html';
            }

            if (getToken()) {
                showProtected();
            } else {
                showLogin();
            }

            // When auth expires, ensure we redirect to the login page
            window.showInlineLogin = showLogin;

            // attach login handler (inline form)
            window.handleInlineLogin = async function (e) {
                e.preventDefault();
                const user = document.getElementById('inline-username').value.trim();
                const pass = document.getElementById('inline-password').value.trim();
                const err = document.getElementById('inline-error');
                if (err) err.style.display = 'none';
                try {
                    const res = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ Username: user, Password: pass })
                    });
                    if (res.ok) {
                        const token = await res.text();
                        setToken(token);
                        location.reload();
                    } else if (res.status === 401) {
                        if (err) { err.innerText = 'שם משתמש או סיסמה שגויים.'; err.style.display = 'block'; }
                    } else {
                        if (err) { err.innerText = 'שגיאה, נסו שוב.'; err.style.display = 'block'; }
                    }
                } catch (e) {
                    if (err) { err.innerText = 'שגיאת רשת.'; err.style.display = 'block'; }
                }
            };
        });

        // CRITICAL: Ensure initial data load after DOM ready
        window.addEventListener('load', () => {
            if (getToken()) {
                console.log('[Data Trigger] Calling getItems() for ice cream list...');
                getItems();
            }
        });
    </script>
</body>

</html>
