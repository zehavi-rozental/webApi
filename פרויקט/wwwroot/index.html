<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Ice cream</title>
    <link rel="stylesheet" href="css/site.css" />
    <style>
        /* Toast Notifications */
        .toast {
            position: absolute;
            padding: 12px 20px;
            border-radius: 4px;
            color: white;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s ease;
            min-width: 200px;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
        }

        .toast-success {
            background-color: #10b981;
        }

        .toast-error {
            background-color: #ef4444;
        }

        .toast-warning {
            background-color: #f59e0b;
        }

        .toast-info {
            background-color: #3b82f6;
        }

        .admin-only {
            display: none;
        }

        .admin-only.show {
            display: block;
        }

        .nav-link {
            cursor: pointer;
            color: #7a5863;
            font-weight: 500;
            text-decoration: underline;
            margin-right: 20px;
        }

        .nav-link:hover {
            color: #5a4863;
        }
    </style>
</head>

<body>
    <header style="max-width:820px;margin:0 auto 1rem;display:flex;justify-content:space-between;align-items:center;">
        <div id="greeting" style="color:#7a5863;font-weight:500;"></div>
        <div>
            <span id="adminLink" class="nav-link" onclick="location.href='user.html'" style="display:none;">👥 Users</span>
            <button id="logoutBtn" onclick="handleLogout()" style="padding:8px 16px;background-color:#dc2626;color:white;border:none;border-radius:4px;cursor:pointer;">Logout</button>
        </div>
    </header>

    <div id="inlineLogin" class="login-card" style="max-width:520px;margin:1rem auto;display:none;">
        <form id="inlineLoginForm" action="javascript:void(0);" onsubmit="handleInlineLogin(event)">
            <input id="inline-username" type="text" placeholder="שם משתמש" required />
            <input id="inline-password" type="password" placeholder="סיסמה" required />
            <input class="login-submit" type="submit" value="התחבר" />
            <p id="inline-error" style="color:#b91c1c;margin-top:0.5rem;display:none"></p>
        </form>
    </div>

    <div id="protectedContent" style="display:none;">
        <h1>Ice cream🍦</h1>
        <h3>Add</h3>
        <form id="addForm" action="javascript:void(0);" method="POST" onsubmit="addItem()">
            <input type="text" id="add-name" placeholder="New ice cream">
            <input type="submit" value="Add">
        </form>

        <div id="editForm">
            <h3>Edit</h3>
            <form action="javascript:void(0);" onsubmit="updateItem()">
                <input type="hidden" id="edit-id">
                <input type="checkbox" id="edit-milki">
                <input type="text" id="edit-name">
                <input type="submit" value="Save">
                <a onclick="closeInput()" aria-label="Close">&#10006;</a>
            </form>
        </div>

        <p id="counter"></p>

        <div id="activityFeed">
            <h3>Activity Feed</h3>
            <ul id="activityList"></ul>
        </div>
        <table>
            <tr>
                <th>Is milki?</th>
                <th>Name</th>
                <th></th>
                <th></th>
            </tr>
            <tbody id="iceCreams"></tbody>
        </table>
    </div>

    <script src="js/signalr.min.js"></script>
    <script src="js/site.js" asp-append-version="true"></script>
</body>

</html>
