<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>👥 User Management - Admin</title>
    <link rel="stylesheet" href="css/site.css" />
</head>

<body>
    <!-- Header Navigation -->
    <header>
        <div id="greeting" class="greeting"></div>
        <nav class="nav-menu">
            <span id="itemsLink" class="nav-link" onclick="location.href='index.html'">🍦 Items</span>
            <button id="editProfileBtn" onclick="toggleEditProfile()" class="btn btn-secondary hidden">✏️ Edit Profile</button>
            <button id="logoutBtn" onclick="handleLogout()" class="btn btn-danger">Logout</button>
        </nav>
    </header>

    <!-- Inline Login Form (shown when token expires) -->
    <div id="inlineLogin" class="login-card card hidden" dir="rtl">
        <form id="inlineLoginForm" action="javascript:void(0);" onsubmit="handleInlineLogin(event)">
            <h3>📥 התחברות מחדש</h3>
            <input id="inline-username" 
                   type="text" 
                   placeholder="שם משתמש" 
                   class="input-field"
                   required />
            <input id="inline-password" 
                   type="password" 
                   placeholder="סיסמה" 
                   class="input-field"
                   required />
            <input class="login-submit" type="submit" value="התחבר" />
            <p id="inline-error" class="error-message"></p>
        </form>
    </div>

    <!-- Protected Content (Admin Functions) -->
    <div id="protectedContent" class="protected-content hidden">
        <h1>👥 User Management</h1>

        <!-- Add New User Form -->
        <section>
            <h3>➕ Add New User</h3>
            <form id="addForm" action="javascript:void(0);" method="POST" onsubmit="addItem(); return false;" class="form-section">
                <input type="text" 
                       id="add-name" 
                       placeholder="New user name" 
                       class="input-field"
                       required>
                <input type="password" 
                       id="add-password" 
                       placeholder="Password" 
                       class="input-field"
                       required>
                <select id="add-role" class="input-field" required>
                    <option value="User">👤 User</option>
                    <option value="Admin">⚙️ Admin</option>
                </select>
                <input type="submit" value="Add User" class="btn btn-primary">
            </form>
        </section>

        <!-- Edit User Form (hidden by default) -->
        <div id="editForm" class="form-section hidden">
            <h3>✏️ Edit User</h3>
            <form action="javascript:void(0);" onsubmit="updateItem(); return false;">
                <input type="hidden" id="edit-id">
                <input type="text" 
                       id="edit-name" 
                       placeholder="User name" 
                       class="input-field"
                       required>
                <input type="password" 
                       id="edit-password" 
                       placeholder="Password" 
                       class="input-field"
                       required>
                <select id="edit-role" class="input-field" required>
                    <option value="User">👤 User</option>
                    <option value="Admin">⚙️ Admin</option>
                </select>
                <div class="form-actions">
                    <input type="submit" value="Save" class="btn btn-primary">
                    <a onclick="closeInput()" 
                       class="btn btn-ghost" 
                       aria-label="Close Edit">Cancel</a>
                </div>
            </form>
        </div>

        <!-- Edit Profile Form (shown only for non-admins) -->
        <div id="editProfileSection" class="form-section hidden">
            <h3>👤 Edit Your Profile</h3>
            <form id="editProfileForm" action="javascript:void(0);" onsubmit="updateProfile(); return false;">
                <input type="text" 
                       id="profile-name" 
                       placeholder="Your name" 
                       class="input-field"
                       required>
                <input type="password" 
                       id="profile-password" 
                       placeholder="New password (optional)" 
                       class="input-field">
                <input type="submit" value="Save" class="btn btn-primary">
            </form>
        </div>

        <!-- User Count -->
        <div id="counterSection" class="info-box">
            <p id="counter"></p>
        </div>

        <!-- Users Table -->
        <section class="table-section">
            <h3>📋 All Users</h3>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Role</th>
                            <th>Edit</th>
                            <th>Delete</th>
                        </tr>
                    </thead>
                    <tbody id="users"></tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer"></div>

    <!-- Load shared utilities first -->
    <script src="js/site.js" asp-append-version="true"></script>
    
    <!-- Load user management functions -->
    <script src="js/siteUser.js" asp-append-version="true"></script>

    <script>
        // ===== User-Specific Functions =====
        function toggleEditProfile() {
            const editProfileSection = document.getElementById('editProfileSection');
            editProfileSection.classList.toggle('hidden');
            if (!editProfileSection.classList.contains('hidden')) {
                document.getElementById('profile-name').value = getUserName() || '';
            }
        }

        function updateProfile() {
            const userApiUri = '/api/User';
            const name = document.getElementById('profile-name').value.trim();
            const password = document.getElementById('profile-password').value;

            if (!name) {
                showToast('Name cannot be empty', 'warning');
                return false;
            }

            const payload = { name };
            if (password) {
                payload.password = password;
            }

            authFetch(`${userApiUri}/profile`, {
                method: 'PUT',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
                .then(response => {
                    if (response.ok) {
                        showToast('Profile updated successfully!', 'success');
                        document.getElementById('editProfileSection').classList.add('hidden');
                    } else {
                        return Promise.reject('Update failed');
                    }
                })
                .catch(error => {
                    console.error('Unable to update profile.', error);
                    showToast('Failed to update profile', 'error');
                });
            
            return false;
        }

        // ===== Page Initialization =====
        document.addEventListener('DOMContentLoaded', () => {
            const greetingEl = document.getElementById('greeting');
            const protectedEl = document.getElementById('protectedContent');
            const userRole = getUserRole();

            if (greetingEl) {
                greetingEl.innerText = `👋 Welcome, ${getUserName()}!`;
            }

            // Always show Edit Profile button
            document.getElementById('editProfileBtn').classList.remove('hidden');

            // Role-based UI
            if (userRole === 'Admin' || userRole === 'admin') {
                // Admin: show user management
                if (protectedEl) protectedEl.classList.remove('hidden');
                document.getElementById('editProfileSection').classList.add('hidden');
                if (getToken()) {
                    getItems(); // Load users from siteUser.js
                }
            } else {
                // Regular user: show profile editor only
                if (protectedEl) protectedEl.classList.add('hidden');
                document.getElementById('editProfileSection').classList.remove('hidden');
            }

            // Redirect if not authenticated
            if (!getToken()) {
                location.href = 'login.html';
            }
        });

        // CRITICAL: Ensure initial data load after DOM ready
        window.addEventListener('load', () => {
            const userRole = getUserRole();
            if (getToken() && (userRole === 'Admin' || userRole === 'admin')) {
                console.log('[Data Trigger] Calling getItems() for user list (admin)...');
                if (typeof getItems === 'function') {
                    getItems();
                }
            }
        });
    </script>
</body>

</html>
